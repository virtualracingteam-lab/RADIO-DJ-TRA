<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>DJ TRA LIVE</title>
    <style>
        html, body { background: #000000; margin: 0; padding: 0; overflow: hidden; width: 100%; height: 100%; }
        .centrado { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; }
        audio { width: 270px; height: 40px; filter: invert(1); border-radius: 40px; }
    </style>
</head>
<body>

<div class="centrado">
    <!-- El reproductor nativo que el juego entiende a la primera -->
    <audio id="reproductorTRA" controls autoplay loop crossorigin="anonymous">
        <source src="https://fpsnew1.listen2myradio.com:2199/listen.php?ip=82.145.63.6&port=5563&type=ice&mount=stream" type="audio/mp3">
    </audio>
</div>

<script type="text/javascript">
    var miAudio = document.getElementById('reproductorTRA');
    miAudio.volume = 1.0;

    function forzarArranque() {
        if (miAudio.paused) {
            miAudio.play().catch(function(e) {
                console.log("Esperando carga...");
            });
        }
    }

    // Le metemos un martillo pilón: intenta reproducir cada 300ms automáticamente
    var bucleFuerza = setInterval(forzarArranque, 300);

    // Si el juego está en modo ultra-estricto, en cuanto camines o cliques en la sala, el bucle salta y arranca el audio
    window.addEventListener('click', function() { forzarArranque(); clearInterval(bucleFuerza); }, { once: true });
    window.addEventListener('keydown', function() { forzarArranque(); clearInterval(bucleFuerza); }, { once: true });
    window.addEventListener('mousemove', function() { forzarArranque(); clearInterval(bucleFuerza); }, { once: true });
</script>

</body>
</html>
