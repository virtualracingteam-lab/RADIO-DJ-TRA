<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>DJ TRA FORZADOR</title>
    <style>
        html, body { background: #000000; margin: 0; padding: 0; overflow: hidden; width: 100%; height: 100%; }
        .centrado { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; }
        audio { width: 270px; height: 40px; filter: invert(1); border-radius: 40px; }
    </style>
</head>
<body>

<div class="centrado">
    <audio id="reproductorTRA" controls autoplay muted loop crossorigin="anonymous">
        <source src="https://fpsnew1.listen2myradio.com:2199/listen.php?ip=82.145.63.6&port=5563&type=ice&mount=stream" type="audio/mp3">
    </audio>
</div>

<script type="text/javascript">
    var miAudio = document.getElementById('reproductorTRA');

    function quitarSilencioFuerza() {
        // Rompemos el candado quitando el mute y subiendo volumen
        miAudio.muted = false;
        miAudio.volume = 1.0;
        miAudio.play().catch(function(e) {
            console.log("Esperando un milisegundo más...");
        });
    }

    // DISPARADOR 1: Espera medio segundo (500ms) a que el juego trague el reproductor y le quita el mute solo
    setTimeout(quitarSilencioFuerza, 500);

    // DISPARADOR 2: Un bucle rápido que insiste cada 300ms en quitar el silencio por si el internet va lento
    var bucleMute = setInterval(function() {
        if (miAudio.muted === false && !miAudio.paused) {
            clearInterval(bucleMute); // Si ya suena alto y claro, apagamos el bucle
        } else {
            quitarSilencioFuerza();
        }
    }, 300);

    // DISPARADOR 3 (Seguridad Utherverse): Si el juego congela los procesos internos hasta que el avatar se mueve,
    // en cuanto hagas un clic en la pantalla para andar o uses el teclado, el sonido se libera al 100% solo
    window.addEventListener('click', function() { quitarSilencioFuerza(); clearInterval(bucleMute); }, { once: true });
    window.addEventListener('keydown', function() { quitarSilencioFuerza(); clearInterval(bucleMute); }, { once: true });
    window.addEventListener('mousemove', function() { quitarSilencioFuerza(); clearInterval(bucleMute); }, { once: true });
</script>

</body>
</html>
